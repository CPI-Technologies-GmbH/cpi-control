[package]
name = "opsboard"
version = "0.1.0"
description = "OpsBoard Desktop – Website & Infrastructure Monitoring"
authors = ["CPI Technologies"]
edition = "2021"

[lib]
name = "opsboard_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
