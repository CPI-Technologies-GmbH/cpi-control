name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Bundle backend
        shell: bash
        run: |
          TAURI_BACKEND="apps/desktop/src-tauri/backend"
          mkdir -p "$TAURI_BACKEND/node_modules"

          # Build backend bundle
          cd packages/backend
          npx tsup

          # Copy all dist files
          cp dist/* "../../$TAURI_BACKEND/"

          # Copy native modules from pnpm store
          cd ../..
          for mod in better-sqlite3 bindings file-uri-to-path keytar node-ssh ssh2 cpu-features; do
            FOUND=$(find node_modules/.pnpm -maxdepth 3 -path "*/$mod/package.json" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              MOD_DIR=$(dirname "$FOUND")
              echo "Copying $mod from $MOD_DIR"
              cp -r "$MOD_DIR" "$TAURI_BACKEND/node_modules/"
            fi
          done

          # Create package.json for module resolution
          echo '{"name":"opsboard-backend-bundle","version":"0.1.0","type":"module","private":true}' > "$TAURI_BACKEND/package.json"

          # Copy drizzle migrations
          if [ -d packages/backend/drizzle ]; then
            cp -r packages/backend/drizzle "$TAURI_BACKEND/"
          fi

          echo "Backend bundle contents:"
          ls -la "$TAURI_BACKEND/"

      - name: Install Apple certificate (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
            security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
            rm certificate.p12
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OpsBoard {0}', github.ref_name) || '' }}
          releaseBody: 'See the assets for download links.'
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opsboard-${{ matrix.platform }}-${{ matrix.rust-target }}
          path: |
            apps/desktop/src-tauri/target/*/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/*/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/*/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/*/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
